# Logs one meal to Cronometer when the iPhone Shortcut sends a "meal" event.
# The meal itself travels in the event payload: no file, no commit, nothing printed.
name: Log Meal

on:
  repository_dispatch:
    types: [meal]

permissions:
  contents: read

# One Cronometer login at a time: two meals sent together queue up instead of clashing.
concurrency:
  group: cronometer
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Australia/Melbourne        # "today" in the diary = today where I am
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Log the meal
        env:
          CRONO_EMAIL: ${{ secrets.CRONO_EMAIL }}
          CRONO_PASSWORD: ${{ secrets.CRONO_PASSWORD }}
        run: python log_dispatch.py
